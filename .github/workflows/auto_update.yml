name: Auto Update M3U Playlist

on:
  schedule:
    # Esegue lo script ogni 5 minuti
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permette anche l'avvio manuale

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Esegui script di aggiornamento
        run: python update_m3u.py

      - name: Salva e pubblica le modifiche
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git commit -m "Auto-update playlist.m3u [skip ci]" || exit 0
          git push
