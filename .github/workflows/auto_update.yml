name: Aggiornamento Automatico M3U

on:
  schedule:
    # Esegue lo script ogni ora
    - cron: '0 * * * *'
  workflow_dispatch: # Permette anche l'avvio manuale

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installa Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Esegui Script di Aggiornamento
        run: python update_m3u.py

      - name: Salva e Pubblica i Cambiamenti
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist M3U" && git push)
